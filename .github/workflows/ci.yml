name: Python tests and application artifact

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run HTTP and financial checks
        run: python -m pytest -v

      - name: Upload tested application
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: laitys-wb-study-python-${{ matrix.python-version }}
          path: |
            app_final.py
            test_app.py
            static/
            data/demo.json
            requirements.txt
            requirements-dev.txt
            README.md
            Запустить.cmd
            .env.example
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
