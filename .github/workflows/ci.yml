name: Python tests and application artifact

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: laitys
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: laitys_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U laitys -d laitys_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      LAITYS_TEST_DATABASE_URL: postgresql://laitys:ci-test-password@127.0.0.1:5432/laitys_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run API, financial and PostgreSQL checks
        run: python -m pytest -v

      - name: Upload tested application
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: laitys-wb-study-python-${{ matrix.python-version }}
          path: |
            app_final.py
            start_local.py
            database.py
            test_app.py
            test_database.py
            conftest.py
            static/
            data/demo.json
            requirements.txt
            requirements-dev.txt
            README.md
            project_passport.md
            Запустить.cmd
            .env.example
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
